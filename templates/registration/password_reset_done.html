{% extends "polls/base.html" %}

{% block title %}Reset link sent · Strawpoll{% endblock %}

{% block content %}
<div class="text-center py-12 max-w-sm mx-auto">
  <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-brand-50 text-brand-600 mb-4">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
  </div>
  <h1 class="text-2xl font-bold text-ink-900">Check your email</h1>
  <p class="text-sm text-ink-500 mt-2">
    If an account exists for that address, a password reset link is on its way.
    In development the email is printed to the server console.
  </p>
  <a href="{% url 'login' %}" class="inline-block mt-4 px-4 py-2 rounded-md border border-ink-200 text-ink-700 text-sm hover:bg-ink-50">Back to sign in</a>
</div>
{% endblock %}
