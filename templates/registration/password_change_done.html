{% extends "polls/base.html" %}

{% block title %}Password changed · Strawpoll{% endblock %}

{% block content %}
<div class="text-center py-12 max-w-sm mx-auto">
  <div class="inline-flex h-12 w-12 items-center justify-center rounded-full bg-emerald-50 text-emerald-600 mb-4">
    <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
  </div>
  <h1 class="text-2xl font-bold text-ink-900">Password changed</h1>
  <p class="text-sm text-ink-500 mt-2">Your password has been updated successfully.</p>
  <a href="{% url 'polls:home' %}" class="inline-block mt-4 px-4 py-2 rounded-md bg-brand-600 text-white text-sm hover:bg-brand-700">Back to polls</a>
</div>
{% endblock %}
